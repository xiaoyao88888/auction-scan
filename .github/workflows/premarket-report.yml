name: premarket-report
on:
  schedule:
    # 北京时间 09:00 = UTC 01:00, 周一至周五
    - cron: "0 1 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Time guard (08:48-09:12 Beijing)
        run: |
          NOW=$(TZ=Asia/Shanghai date +%H:%M)
          if [[ "$NOW" < "08:48" || "$NOW" > "09:12" ]]; then echo "out of slot $NOW, exit"; exit 0; fi
      - name: Dedup guard (skip if today marker exists)
        run: |
          D=$(TZ=Asia/Shanghai date +%Y%m%d)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.github.com/repos/xiaoyao88888/auction-scan/contents/reports/premarket_${D}.md")
          if [ "$CODE" = "200" ]; then echo "marker exists, skip"; exit 0; fi
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -q akshare pandas mcp

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Write MCP config
        run: printf '%s' "${{ secrets.PREMARKET_MCP_JSON }}" > .mcp.json

      - name: Run premarket report
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          ANTHROPIC_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-v4-pro"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro[1m]"
          MAX_MCP_OUTPUT_TOKENS: "25000"
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SUBJECT_PREFIX: "【盘前报告】"
        run: claude -p "$(cat prompt-premarket.md)" --permission-mode bypassPermissions --output-format text

      - name: Commit marker
        run: |
          if [ -f /tmp/premarket.txt ]; then
            mkdir -p reports
            cp /tmp/premarket.txt "reports/premarket_$(TZ=Asia/Shanghai date +%Y%m%d).md"
            git config user.name "scan-bot"
            git config user.email "scan-bot@users.noreply.github.com"
            git add reports/
            git commit -m "premarket marker" || echo "no changes"
            git pull --rebase origin main
            git push
          fi
