name: premarket-report
on:
  schedule:
    # 北京时间 09:00 = UTC 01:00, 周一至周五
    - cron: "0 1 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: premarket-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      date_str: ${{ steps.check.outputs.date_str }}
    steps:
      - id: check
        run: |
          D=$(TZ=Asia/Shanghai date +%Y%m%d)
          NOW=$(TZ=Asia/Shanghai date +%H:%M)
          echo "date_str=$D" >> "$GITHUB_OUTPUT"
          if [[ "$NOW" < "08:48" || "$NOW" > "09:40" ]]; then
            echo "out of slot $NOW, block premarket"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.github.com/repos/xiaoyao88888/auction-scan/contents/reports/premarket_${D}.md")
          if [ "$CODE" = "200" ]; then
            echo "marker exists, skip"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  report:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -q akshare pandas mcp

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Write MCP config
        run: printf '%s' "${{ secrets.PREMARKET_MCP_JSON }}" > .mcp.json

      - name: Run premarket report
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          ANTHROPIC_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-v4-pro"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro[1m]"
          MAX_MCP_OUTPUT_TOKENS: "25000"
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SUBJECT_PREFIX: "【盘前报告】"
        run: claude -p "$(cat prompt-premarket.md)" --permission-mode bypassPermissions --output-format text

      - name: Commit marker
        env:
          DATE_STR: ${{ needs.guard.outputs.date_str }}
        run: |
          if [ -f /tmp/premarket.txt ]; then
            mkdir -p reports
            cp /tmp/premarket.txt "reports/premarket_$DATE_STR.md"
            git config user.name "scan-bot"
            git config user.email "scan-bot@users.noreply.github.com"
            git add reports/
            git commit -m "premarket marker" || echo "no changes"
            git pull --rebase origin main
            git push
          fi
