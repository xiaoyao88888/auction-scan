name: closing-review
on:
  schedule:
    # 北京时间 17:10 = UTC 09:10, 周一至周五
    - cron: "10 9 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "复盘日期(YYYY-MM-DD,留空用今天)"
        required: false
        default: ""

concurrency:
  group: closing-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      date_str: ${{ steps.check.outputs.date_str }}
    steps:
      - id: check
        run: |
          INPUT_DATE="${{ github.event.inputs.date }}"
          if [ -n "$INPUT_DATE" ]; then
            echo "date_str=$(echo $INPUT_DATE | tr -d '-')" >> "$GITHUB_OUTPUT"
            echo "manual date, bypass guard"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          D=$(TZ=Asia/Shanghai date +%Y%m%d)
          NOW=$(TZ=Asia/Shanghai date +%H:%M)
          echo "date_str=$D" >> "$GITHUB_OUTPUT"
          if [[ "$NOW" < "16:58" || "$NOW" > "19:00" ]]; then
            echo "out of slot $NOW, block closing"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.github.com/repos/xiaoyao88888/auction-scan/contents/reports/closing_${D}.md")
          if [ "$CODE" = "200" ]; then
            echo "marker exists, skip"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  review:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Write MCP config
        run: printf '%s' "${{ secrets.WUDAO_MCP_JSON }}" > .mcp.json

      - name: Run closing review
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          ANTHROPIC_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-v4-pro"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro[1m]"
          MAX_MCP_OUTPUT_TOKENS: "25000"
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FORCE_DATE: ${{ github.event.inputs.date }}
        run: claude -p "$(cat prompt-closing.md)" --permission-mode bypassPermissions --output-format text

      - name: Commit merged watch record and marker
        env:
          DATE_STR: ${{ needs.guard.outputs.date_str }}
        run: |
          if [ -f /tmp/record.json ]; then
            mkdir -p push_history
            cp /tmp/record.json "push_history/${DATE_STR}.json"
          fi
          if [ -f /tmp/closing.txt ]; then
            mkdir -p reports
            cp /tmp/closing.txt "reports/closing_${DATE_STR}.md"
          fi
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add push_history/ reports/ 2>/dev/null || true
          git commit -m "closing: ${DATE_STR}" || echo "no changes"
          git pull --rebase origin main
          git push
