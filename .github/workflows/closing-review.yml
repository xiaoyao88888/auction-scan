name: closing-review
on:
  schedule:
    # 北京时间 17:10 = UTC 09:10, 周一至周五
    - cron: "10 9 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "复盘日期(YYYY-MM-DD,留空用今天)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Write MCP config
        run: printf '%s' "${{ secrets.WUDAO_MCP_JSON }}" > .mcp.json

      - name: Run closing review
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          ANTHROPIC_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-v4-pro"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro[1m]"
          MAX_MCP_OUTPUT_TOKENS: "25000"
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FORCE_DATE: ${{ github.event.inputs.date }}
        run: claude -p "$(cat prompt-closing.md)" --permission-mode bypassPermissions --output-format text

      - name: Commit merged watch record
        run: |
          if [ -f /tmp/record.json ]; then
            mkdir -p push_history
            DATE_STR=$(TZ=Asia/Shanghai date +%Y%m%d)
            if [ -n "${{ github.event.inputs.date }}" ]; then
              DATE_STR=$(echo "${{ github.event.inputs.date }}" | tr -d '-')
            fi
            cp /tmp/record.json "push_history/${DATE_STR}.json"
            git config user.name "scan-bot"
            git config user.email "scan-bot@users.noreply.github.com"
            git add push_history/
            git commit -m "merge watch record: ${DATE_STR}" || echo "no changes"
            git pull --rebase origin main
            git push
          fi
