name: auction-scan
on:
  schedule:
    # 北京时间 09:26 = UTC 01:26, 周一至周五
    - cron: "26 1 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: auction-scan-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      date_str: ${{ steps.check.outputs.date_str }}
      date_full: ${{ steps.check.outputs.date_full }}
    steps:
      - id: check
        run: |
          D=$(TZ=Asia/Shanghai date +%Y%m%d)
          DF=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          NOW=$(TZ=Asia/Shanghai date +%H:%M)
          echo "date_str=$D" >> "$GITHUB_OUTPUT"
          echo "date_full=$DF" >> "$GITHUB_OUTPUT"
          if [[ "$NOW" < "09:14" || "$NOW" > "10:30" ]]; then
            echo "out of slot $NOW, block scan"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.github.com/repos/xiaoyao88888/auction-scan/contents/push_history/${D}.json")
          if [ "$CODE" = "200" ]; then
            echo "marker exists, skip"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  scan:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Write MCP config
        run: printf '%s' "${{ secrets.WUDAO_MCP_JSON }}" > .mcp.json

      - name: Run daily scan
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          ANTHROPIC_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-v4-pro"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro[1m]"
          MAX_MCP_OUTPUT_TOKENS: "25000"
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DATE_STR: ${{ needs.guard.outputs.date_full }}
        run: claude -p "$(cat prompt.md)" --permission-mode bypassPermissions --output-format text

      - name: Commit recommendation record
        env:
          DATE_STR: ${{ needs.guard.outputs.date_str }}
        run: |
          if [ -f /tmp/record.json ]; then
            mkdir -p push_history
            cp /tmp/record.json "push_history/$DATE_STR.json"
            git config user.name "scan-bot"
            git config user.email "scan-bot@users.noreply.github.com"
            git add push_history/
            git commit -m "record: $DATE_STR recommendations" || echo "no changes"
            git pull --rebase origin main
            git push
          else
            echo "no record.json, skip commit"
          fi
