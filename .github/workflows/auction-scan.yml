name: auction-scan
on:
  schedule:
    # 北京时间 09:26 = UTC 01:26, 周一至周五
    - cron: "26 1 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: auction-scan-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Time guard (09:14-09:38 Beijing)
        run: |
          echo "DATE_STR=$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_ENV"
          echo "DATE_FULL=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"
          NOW=$(TZ=Asia/Shanghai date +%H:%M)
          if [[ "$NOW" < "09:14" || "$NOW" > "10:30" ]]; then echo "out of slot $NOW, exit"; exit 0; fi
      - name: Dedup guard (skip if today record exists)
        run: |
          D=$DATE_STR
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.github.com/repos/xiaoyao88888/auction-scan/contents/push_history/${D}.json")
          if [ "$CODE" = "200" ]; then echo "record exists, skip"; exit 0; fi
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Write MCP config
        run: printf '%s' "${{ secrets.WUDAO_MCP_JSON }}" > .mcp.json

      - name: Run daily scan
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          ANTHROPIC_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-v4-pro"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro[1m]"
          MAX_MCP_OUTPUT_TOKENS: "25000"
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DATE_STR: $(TZ=Asia/Shanghai date +%Y-%m-%d)
        run: claude -p "$(cat prompt.md)" --permission-mode bypassPermissions --output-format text

      - name: Commit recommendation record
        run: |
          if [ -f /tmp/record.json ]; then
            mkdir -p push_history
            cp /tmp/record.json "push_history/$DATE_STR.json"
            git config user.name "scan-bot"
            git config user.email "scan-bot@users.noreply.github.com"
            git add push_history/
            git commit -m "record: $DATE_STR recommendations" || echo "no changes"
            git pull --rebase origin main
            git push
          else
            echo "no record.json, skip commit"
          fi
