name: weekly-review
on:
  schedule:
    # 北京时间周六 09:00 = UTC 01:00
    - cron: "0 1 * * 6"
  workflow_dispatch: {}

concurrency:
  group: weekly-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      date_str: ${{ steps.check.outputs.date_str }}
    steps:
      - id: check
        run: |
          D=$(TZ=Asia/Shanghai date +%Y%m%d)
          DOW=$(TZ=Asia/Shanghai date +%u)
          NOW=$(TZ=Asia/Shanghai date +%H:%M)
          echo "date_str=$D" >> "$GITHUB_OUTPUT"
          if [ "$DOW" != "6" ] || [[ "$NOW" < "08:48" || "$NOW" > "09:30" ]]; then
            echo "out of slot, block weekly"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://api.github.com/repos/xiaoyao88888/auction-scan/contents/reports/weekly_${D}.md")
          if [ "$CODE" = "200" ]; then
            echo "marker exists, skip"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

  review:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Write MCP config
        run: printf '%s' "${{ secrets.WUDAO_MCP_JSON }}" > .mcp.json

      - name: Run weekly review
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          ANTHROPIC_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_SONNET_MODEL: "deepseek-v4-pro[1m]"
          ANTHROPIC_DEFAULT_HAIKU_MODEL: "deepseek-v4-pro"
          ANTHROPIC_DEFAULT_OPUS_MODEL: "deepseek-v4-pro[1m]"
          MAX_MCP_OUTPUT_TOKENS: "25000"
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: claude -p "$(cat prompt-weekly.md)" --permission-mode bypassPermissions --output-format text

      - name: Archive report
        env:
          DATE_STR: ${{ needs.guard.outputs.date_str }}
        run: |
          if [ -f /tmp/review_*.md ]; then
            mkdir -p reports
            cp /tmp/review_*.md "reports/weekly_$DATE_STR.md"
            git config user.name "scan-bot"
            git config user.email "scan-bot@users.noreply.github.com"
            git add reports/
            git commit -m "weekly review archive" || echo "no changes"
            git pull --rebase origin main
            git push
          fi
